<!doctype html>
<!-- Play Store icon (?art=icon, 512×512) and feature graphic (?art=feature, 1024×500).
     Rendered by: node scripts/store-art.mjs (needs npm run dev, port 5185). -->
<html lang="en"><head><meta charset="utf-8" /><title>store art</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #0d0f14; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  .icon { width: 512px; height: 512px; background: #c6f432; display: grid; place-items: center; }
  .feature { width: 1024px; height: 500px; position: relative; background: radial-gradient(90% 120% at 80% 50%, #2a3410 0%, #0d0f14 65%); color: #f2f5f9; }
  .brand { position: absolute; left: 64px; top: 112px; display: flex; align-items: center; gap: 22px; }
  .brand h1 { margin: 0; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; }
  .logo { width: 96px; height: 96px; border-radius: 24px; background: #c6f432; display: grid; place-items: center; }
  .promise { position: absolute; left: 64px; top: 248px; font-size: 31px; line-height: 1.3; color: #c3ccd8; font-weight: 500; }
  .tag { position: absolute; left: 64px; top: 372px; font-size: 22px; color: #c6f432; font-weight: 650; }
  .clock { position: absolute; right: 70px; top: 96px; width: 330px; text-align: center; }
  .clock .kind { font-size: 34px; font-weight: 800; color: #ff8a3d; }
  .clock .time { font-size: 128px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
  .clock .rounds { font-size: 22px; color: #94a0b3; }
  .clock .bar { height: 8px; border-radius: 4px; background: #1f2530; margin: 26px 20px 0; overflow: hidden; }
  .clock .bar span { display: block; width: 58%; height: 100%; background: #ff8a3d; }
  .wave { position: absolute; right: 120px; bottom: 40px; display: flex; gap: 6px; align-items: flex-end; height: 46px; opacity: .55; }
  .wave i { display: block; width: 7px; border-radius: 4px; background: #c6f432; }
</style></head>
<body>
<template id="mark"><svg viewBox="0 0 108 108"><g transform="translate(20.4 22.6) scale(.56)" fill="#0d0f14"><path d="M55 14h10a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H55a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3Z"/><path fill-rule="evenodd" d="M60 28l36 70H78l-6-13H48l-6 13H24Zm-6 43h12l-6-14Z"/></g></svg></template>
<script>
const art = new URLSearchParams(location.search).get("art") || "icon";
const MARK = document.getElementById("mark").content.firstElementChild;
const mark = (size) => { const s = MARK.cloneNode(true); s.setAttribute("width", size); s.setAttribute("height", size); return s; };
if (art === "icon") {
  // Full bleed: Google Play applies its own rounded mask. The 108-unit canvas puts the mark in its safe zone.
  // Crop the 108-unit adaptive canvas around the mark so it fills ~60% of the store icon.
  const m = mark(512); m.setAttribute("viewBox", "19 19 70 70");
  const d = document.createElement("div"); d.className = "icon"; d.append(m); document.body.append(d);
} else {
  const bars = [14, 30, 22, 40, 18, 34, 26, 44, 20, 32, 16, 38, 24, 28].map((h) => `<i style="height:${h}px"></i>`).join("");
  document.body.innerHTML = `<div class="feature">
    <div class="brand"><div class="logo" id="logo"></div><h1>Allout Timer</h1></div>
    <div class="promise">Interval cues over your own music.<br>It never stops playing.</div>
    <div class="tag">Intervals · HIIT · Tabata · No subscription</div>
    <div class="clock"><div class="kind">Work</div><div class="time">0:37</div><div class="rounds">2 of 3 · 3 of 4</div><div class="bar"><span></span></div></div>
    <div class="wave">${bars}</div>
  </div>`;
  document.getElementById("logo").append(mark(110));
}
</script>
</body></html>
